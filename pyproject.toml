[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-cold-resume-guard"
version = "0.2.2"
description = "Prevent cold-cache token spikes and quota exhaustion in Claude Code & Codex CLI"
readme = "README.md"
authors = [{ name = "Amvotech", email = "support@amvo.store" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["claude-code", "codex-cli", "prompt-caching", "mcp-server", "llm-tokens"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Environment :: Console",
]

[project.scripts]
cold-resume-guard = "cold_resume_guard.cli:main"
claude-guard = "cold_resume_guard.cli:main"
codex-guard = "cold_resume_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
